<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1400">
  <title>블리치 프로필 카드 메이커</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopub@1.0/kopubbatang.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --main-color: #5e5e5e;
      --bg-soft: #5e5e5e26;
      --bg-white: #ffffff;
      --text-main: #2b2b2b;
      --text-sub: #666666;
    }

    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f4f6f9;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      /* 모바일에서 좁아져 카드나 패널이 아래로 흘러내리지 않도록 최소 너비 고정 */
      min-width: 1400px;
    }

    /* 좌측 입력 패널 */
    .controls {
      width: 360px;
      flex-shrink: 0;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .controls h2 { margin: 0; font-size: 18px; color: #111; }
    
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-box label {
      font-size: 12px;
      font-weight: 700;
      color: #555;
    }
    .input-box input[type="text"], 
    .input-box textarea {
      padding: 9px 12px;
      border: 1px solid #e2e5ec;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box input[type="text"]:focus, 
    .input-box textarea:focus {
      border-color: var(--main-color);
    }
    .input-box textarea { resize: vertical; }

    /* 태그 선택 기본 버튼 */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag-btn {
      border: 1px solid #e2e5ec;
      background: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }
    .tag-btn.active {
      background: var(--main-color);
      color: #fff;
      border-color: var(--main-color);
      font-weight: 600;
    }

    /* 세부 서브 패널 */
    .sub-tag-panel {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #fafafa;
      border: 1px dashed #cbd5e1;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .sub-panel-title {
      font-size: 11px;
      font-weight: bold;
      color: #718096;
    }
    
    .tag-btn.sub-btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .tag-btn.sub-btn.active {
      background: var(--bg-soft);
      border-color: var(--main-color);
      color: var(--text-main);
      font-weight: 700;
    }

    .file-input {
      font-size: 12px;
      color: #666;
    }

    .sub-slot-input {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }
    .sub-slot-input input[type="text"] {
      width: 100px;
      padding: 4px 8px;
      font-size: 11px;
    }

    /* 업로드된 사진 관리 리스트 스타일 */
    .uploaded-img-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .uploaded-img-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #e2e5ec;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .img-item-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .img-thumb {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #e2e5ec;
    }
    .img-item-name {
      font-weight: 600;
      color: #334155;
    }
    .btn-del-slot {
      background: #fee2e2;
      color: #ef4444;
      border: none;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-del-slot:hover {
      background: #fca5a5;
      color: #b91c1c;
    }

    .btn-download {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-download:hover { background: #0f172a; }

    .btn-reset {
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:hover {
      background: #f1f5f9;
      color: #334155;
    }

    /* 우측 카드 영역 (980px 고정) */
    #card {
      width: 980px;
      flex-shrink: 0;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 카드 상단 */
    .card-header {
      background: var(--bg-soft);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--main-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 13px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    
    .speech-box {
      background: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      position: relative;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      max-width: 220px;
      word-break: break-word;
    }
    .speech-box::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 6px 8px 6px 0;
      border-color: transparent #fff transparent transparent;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    .category-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .category-title {
      font-size: 13px;
      font-weight: 700;
      color: #444;
      min-width: 60px;
      text-align: right;
    }
    .badge-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
    }
    .card-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.8);
      color: #999;
    }
    .card-badge.on {
      background: var(--main-color);
      color: #ffffff;
      font-weight: 600;
    }
    .card-badge.sub-on {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--main-color);
      font-size: 10px;
      padding: 2px 6px;
      font-weight: 600;
    }

    /* 카드 본문 */
    .card-content {
      padding: 32px 32px 36px 32px;
      display: grid;
      grid-template-columns: 1.15fr 1.25fr;
      gap: 28px;
      position: relative;
    }

    /* 본문 좌측 컬럼 */
    .info-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }

    .name-handle-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .card-name {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }
    .card-handle {
      font-size: 13px;
      font-weight: 500;
      color: #8e95a5;
    }

    .consume-box-wrapper {
      background: var(--bg-soft);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .consume-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .text-box-card {
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .free-box {
      flex: 1.8;
      min-height: 140px;
    }
    .ng-box {
      flex: 1;
      min-height: 85px;
    }
    .text-box-card h4 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #555;
    }
    .text-box-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 본문 우측 컬럼 */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      position: relative;
    }

    .gallery-column {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      flex: 1;
    }
    .main-slot {
      background: var(--bg-soft);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--main-color);
      font-weight: 600;
      font-size: 13px;
      min-height: 270px;
      position: relative;
    }
    .sub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
    }
    .sub-slot {
      background: var(--main-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
